<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="main-header">
    <img src="assets/world.png" alt="World icon" />
    <h1>Country Explorer</h1>
  </header>

  <section class="detail-page">
    <button id="back-btn" class="back-btn">Back</button>

    <div class="detail-content">
      <h2 id="country-name" class="detail-title"></h2>
      <img id="country-flag" class="detail-flag" alt="Country flag" />

      <p><strong>Population:</strong> <span id="population"></span></p>
      <p><strong>Region:</strong> <span id="region"></span></p>
      <p><strong>Sub region:</strong> <span id="sub-region"></span></p>
      <p><strong>Capital:</strong> <span id="capital"></span></p>
      <p><strong>Currencies:</strong> <span id="currencies"></span></p>
      <p><strong>Languages:</strong> <span id="languages"></span></p>
    </div>
  </section>

  <script src="detail.js"></script>
</body>
</html>
